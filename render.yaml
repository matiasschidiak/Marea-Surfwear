# Blueprint de Render (alternativa a Vercel): https://render.com/docs/blueprint-spec
# La base de datos y las fotos viven en Supabase, así que NO hace falta disco persistente.
# En Render: New → Blueprint → elegí este repositorio. Las variables marcadas con
# "sync: false" te las pide al crear el servicio.
services:
  - type: web
    name: marea-surfwear
    runtime: node
    plan: free            # con Supabase alcanza el plan gratis (se "duerme" si nadie entra; el starter no)
    region: virginia
    buildCommand: npm ci --omit=dev
    startCommand: npm run start:prod
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL        # Supabase → Connect → Transaction pooler
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: WHATSAPP_NUMBER
        value: "5492994154002"
      - key: STORE_ADDRESS
        value: Neuquén Capital, Argentina
      # Administrador inicial (solo se usa si todavía no hay ninguno)
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Opcional: tu dominio propio, ej. https://www.mareasurfwear.com.ar
      # Si lo dejás vacío se usa la dirección .onrender.com
      - key: SITE_URL
        sync: false
